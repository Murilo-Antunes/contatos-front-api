<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contatos</title>
    <script src="js/app.js" defer type="module"></script>
    <link rel="stylesheet" href="css/style.css">
    
</head>
<body>
    <header>
        <h1>Contatos</h1>
    </header>
    <main>
        <div class="main-container">
            <section class="form-container">
                <form action="" id="form">
                    <div class="input-container">
                        <label for="nome">Nome:</label>
                        <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>

                        <label for="email">E-mail:</label>
                        <input type="email" id="email" name="email" placeholder="exemplo@email.com" required>

                        <label for="cidade">Cidade:</label>
                        <input type="text" id="cidade" name="cidade" placeholder="Machado Mineiro" required>
            
                        <label for="telefone">Telefone:</label>
                        <input type="tel" id="telefone" name="telefone" placeholder="11 9 7171-6464" maxlength="14" required>

                        <label for="endereco">Endereço:</label>
                        <input type="text" id="endereco" name="endereco" placeholder="Rua. Maringa, 33" required>

                        <label for="foto">Foto:</label>
                        <input type="text" id="foto" name="foto" placeholder="Coloque a url da foto" required>
                    </div>
                    <button id="salvar" type="submit">Salvar Contato</button>
                </form>
            </section>
            <section class="table">
                <table>
                    <thead>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Telefone</th>
                        <th>Email</th>
                        <th>Endereço</th>
                        <th>Cidade</th>
                        <th>Foto</th>
                        <th class="acoes-title">Ações</th>
                    </thead>
                    <tbody id="tbody" class="tbody">
                    </tbody>
                </table>
            </section>
        </div>
    </main>
    <footer>

    </footer>
</body>
</html>
